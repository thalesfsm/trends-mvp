<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Trends MVP</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 40px;
    }

    h1 {
      color: #38bdf8;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .trend {
      font-weight: bold;
      color: #fbbf24;
    }

    .volume {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<h1>🔥 Trends do Dia</h1>

<div id="container">Carregando...</div>

<script>
async function loadTrends() {
  try {
    const res = await fetch("trends.json?v=" + Date.now());
    const data = await res.json();

    const container = document.getElementById("container");
    container.innerHTML = "";

    data.forEach(item => {
      container.innerHTML += `
        <div class="card">
          <div class="trend">${item.trend}</div>
          <div class="volume">${item.volume}</div>
        </div>
      `;
    });

  } catch (err) {
    document.getElementById("container").innerHTML =
      "Erro ao carregar trends";
    console.log(err);
  }
}

loadTrends();
setInterval(loadTrends, 60000);
</script>

</body>
</html>
